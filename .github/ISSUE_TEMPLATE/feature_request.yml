name: 功能建议
description: 建议新的功能、交互或兼容能力
title: "[建议] "
labels: ["enhancement"]
body:
  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options: ["Android", "Windows", "双平台", "仓库与文档"]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 请先描述用户场景和当前困难，不要只写实现名称
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试方案或替代方式
  - type: checkboxes
    id: scope
    attributes:
      label: 确认
      options:
        - label: 该建议不要求提供、抓取或绕过授权访问媒体内容
          required: true
