name: yingyu
description: 映屿 Android Emby 播放器
publish_to: none
version: 1.9.6+224
environment:
  sdk: '>=3.12.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: 1.0.8
  liquid_glass_widgets:
    path: dependencies/liquid_glass_widgets
  http: 1.6.0
  crypto: 3.0.7
  shared_preferences: 2.5.5
  media_kit: 1.2.6
  media_kit_video: 2.0.1
  media_kit_libs_android_video:
    path: dependencies/media_kit_libs_android_video
  cached_network_image: 3.4.1
  flutter_cache_manager: 3.4.1
  # Official pre-JNI platform implementation; avoids an unused native toolchain.
  path_provider_android: 2.2.22
  visibility_detector: 0.4.0+2
  pinyin:
    path: dependencies/pinyin
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  fake_async: 1.3.3
  synchronized: 3.4.2
dependency_overrides:
  # Same 2.0.1; avoid initial/cleanup surface seeks and stale Dart timestamps.
  media_kit_video:
    path: dependencies/media_kit_video
  # Fixed 1.2.6 with URL preservation and native lifecycle events; see UPSTREAM.md.
  media_kit:
    path: dependencies/media_kit
flutter:
  uses-material-design: true
  assets:
    - assets/yingyu.png
    - assets/OPEN_SOURCE_NOTICES.txt
    - assets/translation/
